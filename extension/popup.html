<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f6f7f9;
      --text: #1d2026;
      --muted: #6a7280;
      --line: #e3e6ea;
      --gold: #ffd700;
      --gold-deep: #b8860b;
      --on: #c99a06;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191d;
        --panel: #202328;
        --text: #eceef1;
        --muted: #9aa1ac;
        --line: #2e3238;
        --on: #e0b31a;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 320px; margin: 0; background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      position: relative; overflow: hidden; padding: 16px 16px 14px;
      background: linear-gradient(135deg, #2a2108, #4a3a08 60%, #6b5309);
      color: #fff8dc;
    }
    header::after { /* the laser, previewed */
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 35%, rgba(255, 240, 170, .55) 50%, transparent 65%);
      transform: translateX(-100%); animation: sweep 2.4s linear infinite;
    }
    body.paused header::after, body.off header::after { animation-play-state: paused; opacity: 0; }
    @keyframes sweep { to { transform: translateX(100%); } }
    .title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
    .title .star { color: var(--gold); font-size: 18px; text-shadow: 0 0 10px rgba(255, 215, 0, .8); }
    .status { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #f3e3a6; }
    .count {
      display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 7px;
      border-radius: 10px; background: var(--gold); color: #3d2e00; font-weight: 700; font-size: 12px;
    }
    body.off .count { background: #8a8f98; color: #fff; }

    main { padding: 12px 16px 14px; display: grid; gap: 12px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
    .row + .row { border-top: 1px solid var(--line); }
    .label { display: grid; }
    .label small { color: var(--muted); font-size: 11.5px; }

    /* Switch */
    .switch { position: relative; width: 36px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch span {
      position: absolute; inset: 0; border-radius: 20px; background: #b9bec6; cursor: pointer; transition: background .2s;
    }
    .switch span::before {
      content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .2s;
    }
    .switch input:checked + span { background: var(--on); }
    .switch input:checked + span::before { transform: translateX(16px); }
    .switch input:focus-visible + span { outline: 2px solid var(--gold-deep); outline-offset: 2px; }

    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--bg); cursor: pointer; padding: 0;
      box-shadow: 0 0 0 1px var(--line); transition: transform .12s;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--gold-deep); }
    input[type="color"] { width: 34px; height: 24px; border: 1px solid var(--line); border-radius: 6px; padding: 1px; background: var(--bg); cursor: pointer; }
    input[type="range"] { width: 120px; accent-color: var(--on); }
    input[type="text"] {
      width: 140px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit;
    }
    .colors { display: flex; gap: 8px; align-items: center; }

    footer { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 14px; color: var(--muted); font-size: 11.5px; }
    kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel); color: var(--text); }
    .link { background: none; border: 0; padding: 0; color: var(--gold-deep); cursor: pointer; font: inherit; }
    @media (prefers-color-scheme: dark) { .link { color: var(--on); } }
  </style>
</head>
<body>
  <header>
    <div class="title"><span class="star">✦</span> Sparkle Highlighter</div>
    <div class="status"><span class="count" id="count">0</span><span id="statusText">lit on this page</span></div>
  </header>

  <main>
    <section>
      <div class="row">
        <div class="label">Highlighting<small>Lines, buttons and icons with ✦</small></div>
        <label class="switch"><input type="checkbox" id="enabled" /><span></span></label>
      </div>
      <div class="row">
        <div class="label">Running laser<small>Moving light on lines and buttons</small></div>
        <label class="switch"><input type="checkbox" id="animate" /><span></span></label>
      </div>
      <div class="row">
        <div class="label">Laser speed</div>
        <input type="range" id="speed" min="1" max="5" step="0.2" title="Seconds per sweep" />
      </div>
    </section>

    <section>
      <div class="row">
        <div class="label">Colour</div>
        <div class="swatches" id="presets"></div>
      </div>
      <div class="row">
        <div class="label">Custom<small>Line and edge colour</small></div>
        <div class="colors">
          <input type="color" id="lineColor" title="Line colour" />
          <input type="color" id="accentColor" title="Edge colour" />
        </div>
      </div>
    </section>

    <section>
      <div class="row">
        <div class="label">Only words<small>Empty = any word</small></div>
        <input type="text" id="words" placeholder="e.g. SAST, SCA" />
      </div>
    </section>
  </main>

  <footer>
    <span>Toggle: <kbd id="shortcut">Alt+Shift+G</kbd></span>
    <button class="link" id="reset">Reset to gold</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
